<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FaultDetect 内置教学业务系统</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      padding: 36px 24px;
      background: #f2f5f8;
      color: #172033;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
    }
    main { max-width: 920px; margin: 0 auto; }
    .eyebrow { color: #0071e3; font-size: 12px; font-weight: 700; letter-spacing: .08em; }
    h1 { margin: 8px 0 8px; font-size: 30px; }
    .lead { margin: 0; color: #667085; line-height: 1.7; }
    .notice {
      margin: 22px 0;
      padding: 13px 15px;
      border: 1px solid #cfe3fb;
      border-left: 3px solid #0071e3;
      border-radius: 8px;
      background: #f5f9ff;
      color: #475467;
      font-size: 13px;
      line-height: 1.7;
    }
    .actions {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
      margin: 22px 0;
    }
    button {
      min-height: 92px;
      padding: 14px;
      border: 1px solid #dfe4ea;
      border-radius: 8px;
      background: #fff;
      color: #172033;
      font: inherit;
      text-align: left;
      cursor: pointer;
    }
    button:hover { border-color: #0071e3; }
    button strong { display: block; margin-bottom: 5px; font-size: 14px; }
    button span { color: #667085; font-size: 12px; line-height: 1.5; }
    .result {
      padding: 16px;
      border: 1px solid #dfe4ea;
      border-radius: 8px;
      background: #fff;
    }
    .result h2 { margin: 0 0 9px; font-size: 15px; }
    pre { margin: 0; color: #475467; white-space: pre-wrap; word-break: break-word; }
    @media (max-width: 720px) {
      body { padding: 24px 14px; }
      h1 { font-size: 24px; }
      .actions { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">FAULTDETECT · BUILT-IN DEMO</div>
    <h1>内置教学业务系统</h1>
    <p class="lead">这是一个只在本机运行的模拟页面，用来练习“开始记录 → 点击业务按钮 → 选择请求 → 执行诊断”。不会提交真实业务数据。</p>

    <div class="notice">
      先回到 FaultDetect 主窗口点击“开始记录本次问题”，再回到本页面点击下面任意一个按钮。
      完成后按 <strong>F8</strong> 关闭采集窗口并查看本次记录。
    </div>

    <section class="actions" aria-label="教学操作">
      <button type="button" data-demo="ok">
        <strong>查询订单（正常）</strong>
        <span>GET /demo/api/ok · HTTP 200</span>
      </button>
      <button type="button" data-demo="error">
        <strong>查询订单（失败）</strong>
        <span>GET /demo/api/error · HTTP 500</span>
      </button>
      <button type="button" data-demo="post">
        <strong>提交审批（失败）</strong>
        <span>POST /demo/api/post-error · 不允许自动重放</span>
      </button>
    </section>

    <section class="result">
      <h2>本次操作结果</h2>
      <pre id="result">还没有执行操作。</pre>
    </section>
  </main>

  <script>
    document.cookie = "fd_demo_session=teaching-session; SameSite=Lax";
    const result = document.getElementById("result");
    const headers = {
      "Authorization": "Bearer faultdetect-demo-token",
      "X-Demo-Tenant": "teaching"
    };

    async function run(action) {
      result.textContent = "请求中...";
      const options = action === "post"
        ? { method: "POST", headers: { ...headers, "Content-Type": "application/json" }, body: "{}" }
        : { headers };
      const path = action === "post"
        ? "/demo/api/post-error"
        : `/demo/api/${action}`;
      try {
        const response = await fetch(path, options);
        result.textContent = `HTTP ${response.status}\n${await response.text()}`;
      } catch (error) {
        result.textContent = `请求失败：${error.message}`;
      }
    }

    document.querySelectorAll("[data-demo]").forEach(button => {
      button.addEventListener("click", () => run(button.dataset.demo));
    });
  </script>
</body>
</html>
